name: Update OpenAPI spec

on:
  schedule:
    - cron: "0 13 * * 1" # Mondays, 13:00 UTC
  workflow_dispatch:
    inputs:
      ref:
        description: t-performance-dash branch, tag, or commit SHA
        default: main

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch spec
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPEC_REF: ${{ inputs.ref || 'main' }}
        run: |
          bash scripts/update-openapi.sh "$SPEC_REF"
          # The lock's SHA moves with every dashboard commit; only propose a PR when the spec itself changed.
          if git diff --quiet -- Sources/TransitMattersAPI/openapi.json; then
            git checkout -- Sources/TransitMattersAPI/openapi.lock
          fi

      - name: Summarize
        id: summary
        run: |
          {
            echo 'lock<<EOF'
            cat Sources/TransitMattersAPI/openapi.lock
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: peter-evans/create-pull-request@v8
        with:
          # PRs opened with the default GITHUB_TOKEN don't trigger CI. Set SPEC_UPDATE_TOKEN
          # (a fine-grained PAT or GitHub App token with contents + pull-requests write) so they do.
          token: ${{ secrets.SPEC_UPDATE_TOKEN || github.token }}
          branch: automation/update-openapi
          delete-branch: true
          add-paths: Sources/TransitMattersAPI/openapi.*
          commit-message: Update OpenAPI spec from t-performance-dash
          title: Update OpenAPI spec from t-performance-dash
          body: |
            Automated refresh of `Sources/TransitMattersAPI/openapi.json` via `scripts/update-openapi.sh`.

            ```
            ${{ steps.summary.outputs.lock }}
            ```

            If CI fails here, the generated client changed in a way the `TransitMatters` facade needs to absorb.
