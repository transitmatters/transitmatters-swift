<!-- TransitMatters Labs header, matching https://transitmatters.github.io/architecture/. The flask is Resources/favicon.png inlined, since templates don't get the hosting base path. -->
<style>
  .tm-header {
    display: flex;
    align-items: center;
    gap: 12px;
    height: 48px;
    padding: 0 22px;
    background: #1773ba;
    color: #fff;
    font-family: var(--typography-html-font, Roboto, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif);
    box-shadow: 0 0 4px rgba(0, 0, 0, 0.1), 0 4px 8px rgba(0, 0, 0, 0.2);
    position: relative;
    z-index: 1;
  }
  .tm-header a {
    color: inherit;
    text-decoration: none;
  }
  .tm-header__home {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 18px;
    font-weight: 700;
    white-space: nowrap;
  }
  .tm-header__home img {
    width: 32px;
    height: 32px;
  }
  .tm-header__repo {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
    font-size: 13px;
    opacity: 0.9;
    transition: opacity 0.25s;
  }
  .tm-header__repo:hover {
    opacity: 1;
  }
  .tm-header__repo svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
  }
  @media (max-width: 600px) {
    .tm-header__repo span {
      display: none;
    }
  }
</style>
